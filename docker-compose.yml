services:

  retail-app:
    image: retail-app:${APP_VERSION}
    container_name: retail-app
    ports:
      - "8081:8081"

    environment:
      APP_VERSION: ${APP_VERSION}
      HEALTH_STATUS: ${HEALTH_STATUS:-healthy}

    networks:
      - retail-network

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  retail-network:
    driver: bridge